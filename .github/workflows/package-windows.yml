name: Windows Package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check
        run: npm run release:check

      - name: Generate checksum
        run: npm run release:checksum

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceAssistant-windows-portable
          path: |
            apps/desktop/release/VoiceAssistant-*-x64.exe
            apps/desktop/release/VoiceAssistant-*-x64.exe.sha256
